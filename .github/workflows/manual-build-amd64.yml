name: 手动构建 AMD64

on:
  workflow_dispatch:

jobs:
  build:
    name: 构建 Linux x86_64 版本
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 构建项目
        run: |
          cargo build --release --target x86_64-unknown-linux-musl

      - name: 打包二进制文件供 Docker 使用
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar czf bili-sync-rs-Linux-x86_64-musl.tar.gz bili-sync-rs
          mv bili-sync-rs-Linux-x86_64-musl.tar.gz ../../../

      - name: 生成时间戳
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: 构建 Docker 镜像
        run: |
          IMAGE_NAME="bilibili-ly-${{ steps.timestamp.outputs.timestamp }}"
          docker build --platform linux/amd64 -t ${IMAGE_NAME} .
          docker save ${IMAGE_NAME} | gzip > bilibili-ly-docker-amd64.tar.gz
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像名称**: \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**使用方法**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 1. 下载并导入镜像" >> $GITHUB_STEP_SUMMARY
          echo "gunzip -c bilibili-ly-docker-amd64.tar.gz | docker load" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 2. 运行容器" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name bili-sync --restart unless-stopped \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 12345:12345 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /临时存储/docker/bilibili:/app/.config/bili-sync \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /我的文件/LY/资源采集/哔哩哔哩:/bl \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e TZ=Asia/Shanghai \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 上传 Docker 镜像
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-ly-docker-amd64
          path: bilibili-ly-docker-amd64.tar.gz
          retention-days: 3
          compression-level: 0
